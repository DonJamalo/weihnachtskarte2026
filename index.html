<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Weihnachtskarte 2026</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            touch-action: none;
        }

        /*
         * FOTO
         */
        #scene {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /*
         * SCHNEE-CANVAS
         */
        #snowCanvas {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;
        }


        /*
         * START-BUTTON
         */
        #startButton {

            position: fixed;

            z-index: 20;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            padding: 15px 28px;

            border: none;

            border-radius: 50px;

            background: rgba(255,255,255,0.92);

            color: #222;

            font-family: Arial, sans-serif;

            font-size: 16px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.3);

            cursor: pointer;
        }


        /*
         * HINWEIS
         */
        #hint {

            position: fixed;

            z-index: 10;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;

            text-align: center;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            text-shadow:
                0 1px 5px rgba(0,0,0,0.9);

            pointer-events: none;

            opacity: 0.9;

            transition:
                opacity 1s ease;
        }

    </style>
</head>


<body>


    <!--
         SPÄTER KOMMT HIER DEIN FOTO HIN

         Die Datei muss zunächst "foto.jpg" heißen.
    -->

    <img
        id="scene"
        src="foto.jpg"
        alt=""
    >


    <!--
         CANVAS FÜR DEN SCHNEE
    -->

    <canvas id="snowCanvas"></canvas>


    <button id="startButton">

        Frohe Weihnachten
        ❄️ 2026 ❄️

    </button>


    <audio
        id="backgroundMusic"
        src="hintergrund.mp3"
        loop
        preload="auto">
    </audio>



<script>


/* ==================================================
   GRUNDEINSTELLUNGEN
================================================== */

const canvas =
    document.getElementById("snowCanvas");

const ctx =
    canvas.getContext("2d");

const startButton =
    document.getElementById("startButton");

const hint =
    document.getElementById("hint");

const music =
    document.getElementById("backgroundMusic");


let width = 0;
let height = 0;

let lastTime =
    performance.now();



/* ==================================================
   CANVAS GRÖSSE
================================================== */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();



/* ==================================================
   SMARTPHONE-WIND
================================================== */

let windX = 0;

let targetWind = 0;



/* ==================================================
   SCHNEEFLOCKEN
================================================== */

class Snowflake {

    constructor(layer) {

        this.layer =
            layer;

        this.reset(true);
    }


    reset(initial = false) {

        this.x =
            Math.random() * width;


        this.y =
            initial
                ? Math.random() * height
                : -20;


        /*
         * HINTERGRUND
         *
         * Kleine und langsame Flocken
         */

        if (
            this.layer === "back"
        ) {

            this.size =
                Math.random() * 1.5 + 0.5;

            this.speed =
                Math.random() * 20 + 15;

            this.opacity =
                Math.random() * 0.25 + 0.2;

            this.windMultiplier =
                0.35;

            this.flutter =
                Math.random() * 4 + 2;
        }


        /*
         * MITTELGRUND
         */

        else if (
            this.layer === "middle"
        ) {

            this.size =
                Math.random() * 2.5 + 1.5;

            this.speed =
                Math.random() * 35 + 25;

            this.opacity =
                Math.random() * 0.35 + 0.35;

            this.windMultiplier =
                0.7;

            this.flutter =
                Math.random() * 8 + 4;
        }


        /*
         * VORDERGRUND
         *
         * Große und schnellere Flocken
         */

        else {

            this.size =
                Math.random() * 4 + 3;

            this.speed =
                Math.random() * 45 + 35;

            this.opacity =
                Math.random() * 0.35 + 0.5;

            this.windMultiplier =
                1.2;

            this.flutter =
                Math.random() * 14 + 7;
        }


        this.phase =
            Math.random() *
            Math.PI *
            2;


        this.phaseSpeed =
            Math.random() * 2 + 0.5;


        this.rotation =
            Math.random() *
            Math.PI *
            2;


        this.rotationSpeed =
            (Math.random() - 0.5) * 1.5;
    }


    update(delta) {

        /*
         * Nach unten fallen
         */

        this.y +=
            this.speed *
            delta;


        /*
         * Leichtes natürliches Flattern
         */

        this.phase +=
            this.phaseSpeed *
            delta;


        const flutter =
            Math.sin(this.phase) *
            this.flutter;


        /*
         * Smartphone-Neigung
         */

        this.x +=
            (
                windX *
                this.windMultiplier
                +
                flutter
            )
            * delta;


        this.rotation +=
            this.rotationSpeed *
            delta;


        /*
         * Wieder oben einsetzen
         */

        if (
            this.y >
            height + 20
        ) {

            this.reset();
        }


        /*
         * Seitenbegrenzung
         */

        if (
            this.x >
            width + 30
        ) {

            this.x = -30;
        }


        if (
            this.x <
            -30
        ) {

            this.x =
                width + 30;
        }
    }


    draw() {

        ctx.save();


        ctx.translate(
            this.x,
            this.y
        );


        /*
         * Kleine Flocken
         */

        if (
            this.size < 2
        ) {

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                this.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${this.opacity}
                )`;

            ctx.fill();
        }


        /*
         * Größere Flocken
         */

        else {

            ctx.rotate(
                this.rotation
            );


            ctx.strokeStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${this.opacity}
                )`;


            ctx.lineWidth =
                Math.max(
                    0.6,
                    this.size * 0.25
                );


            /*
             * Sechs Arme
             */

            for (
                let i = 0;
                i < 6;
                i++
            ) {

                ctx.rotate(
                    Math.PI / 3
                );


                ctx.beginPath();

                ctx.moveTo(
                    -this.size,
                    0
                );

                ctx.lineTo(
                    this.size,
                    0
                );

                ctx.stroke();
            }
        }


        ctx.restore();
    }
}



/* ==================================================
   SCHNEEFLOCKEN ERSTELLEN
================================================== */

const backSnow = [];
const middleSnow = [];
const frontSnow = [];


const BACK_COUNT = 100;
const MIDDLE_COUNT = 70;
const FRONT_COUNT = 35;


for (
    let i = 0;
    i < BACK_COUNT;
    i++
) {

    backSnow.push(
        new Snowflake("back")
    );
}


for (
    let i = 0;
    i < MIDDLE_COUNT;
    i++
) {

    middleSnow.push(
        new Snowflake("middle")
    );
}


for (
    let i = 0;
    i < FRONT_COUNT;
    i++
) {

    frontSnow.push(
        new Snowflake("front")
    );
}



/* ==================================================
   AUFGEWIRBELTER SCHNEE
================================================== */

/*
 * WICHTIG:
 *
 * Hier wird KEINE Schneeschicht erzeugt.
 *
 * Die Schneeschicht befindet sich bereits
 * auf deinem späteren Foto.
 *
 * Die Partikel entstehen beim Schütteln
 * lediglich im unteren Bereich des Bildes.
 */


const blownSnow = [];


class BlownSnow {

    constructor(
        x,
        y,
        power
    ) {

        this.x = x;
        this.y = y;


        /*
         * Seitliche Geschwindigkeit
         */

        this.vx =
            (
                Math.random() - 0.5
            )
            *
            power
            *
            120;


        /*
         * Nach oben
         */

        this.vy =
            -(
                Math.random() *
                power *
                120
                +
                40
            );


        /*
         * Wind berücksichtigen
         */

        this.vx +=
            windX * 0.5;


        this.gravity =
            120 +
            Math.random() * 100;


        this.size =
            Math.random() * 3 + 1;


        this.life =
            Math.random() * 1.2
            +
            0.8;


        this.maxLife =
            this.life;


        this.rotation =
            Math.random() *
            Math.PI *
            2;


        this.rotationSpeed =
            (
                Math.random() - 0.5
            ) * 3;
    }


    update(delta) {

        /*
         * Schwerkraft
         */

        this.vy +=
            this.gravity *
            delta;


        /*
         * Bewegung
         */

        this.x +=
            this.vx *
            delta;

        this.y +=
            this.vy *
            delta;


        /*
         * Luftreibung
         */

        this.vx *=
            0.995;


        /*
         * Wind
         */

        this.vx +=
            windX *
            0.08 *
            delta;


        this.rotation +=
            this.rotationSpeed *
            delta;


        this.life -=
            delta;
    }


    draw() {

        const alpha =
            Math.max(
                0,
                this.life /
                this.maxLife
            );


        ctx.save();


        ctx.translate(
            this.x,
            this.y
        );


        ctx.rotate(
            this.rotation
        );


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            this.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${alpha}
            )`;


        ctx.fill();


        ctx.restore();
    }
}



/* ==================================================
   SCHNEE AUFWIRBELN
================================================== */

function blowSnow(
    power = 1
) {

    /*
     * Wir erzeugen Partikel
     * im unteren Bereich.
     */

    const amount =
        Math.min(
            Math.floor(
                35 * power
            ),
            120
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const x =
            Math.random() *
            width;


        /*
         * Untere ca. 10 Pixel
         *
         * Hier befindet sich später
         * dein Schnee im Foto.
         */

        const y =
            height -
            Math.random() * 10;


        blownSnow.push(
            new BlownSnow(
                x,
                y,
                power
            )
        );
    }


    /*
     * Sicherheitslimit
     */

    while (
        blownSnow.length > 250
    ) {

        blownSnow.shift();
    }
}



/* ==================================================
   AUFGEWIRBELTEN SCHNEE AKTUALISIEREN
================================================== */

function updateBlownSnow(delta) {

    for (
        let i =
            blownSnow.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            blownSnow[i];


        particle.update(
            delta
        );


        if (
            particle.life <= 0
            ||
            particle.y >
            height + 20
        ) {

            blownSnow.splice(
                i,
                1
            );
        }
    }
}



/* ==================================================
   AUFGEWIRBELTEN SCHNEE ZEICHNEN
================================================== */

function drawBlownSnow() {

    for (
        const particle
        of blownSnow
    ) {

        particle.draw();
    }
}



/* ==================================================
   SMARTPHONE-NEIGUNG
================================================== */

function handleOrientation(
    event
) {

    /*
     * gamma:
     *
     * -90° = links
     *   0° = gerade
     * +90° = rechts
     */

    let tilt =
        event.gamma || 0;


    /*
     * Begrenzen
     */

    tilt =
        Math.max(
            -40,
            Math.min(
                40,
                tilt
            )
        );


    /*
     * Neigung wird zu Wind
     */

    targetWind =
        tilt * 1.8;
}



/* ==================================================
   WIND GLÄTTEN
================================================== */

function updateWind() {

    windX +=
        (
            targetWind -
            windX
        )
        * 0.08;
}



/* ==================================================
   SCHÜTTELN ERKENNEN
================================================== */

let lastAcceleration = {
    x: 0,
    y: 0,
    z: 0
};


let lastShake = 0;


function handleMotion(
    event
) {

    const acceleration =
        event.accelerationIncludingGravity;


    if (!acceleration) {
        return;
    }


    const x =
        acceleration.x || 0;

    const y =
        acceleration.y || 0;

    const z =
        acceleration.z || 0;


    /*
     * Veränderung berechnen
     */

    const change =
        Math.abs(
            x -
            lastAcceleration.x
        )
        +
        Math.abs(
            y -
            lastAcceleration.y
        )
        +
        Math.abs(
            z -
            lastAcceleration.z
        );


    lastAcceleration = {
        x,
        y,
        z
    };


    const now =
        Date.now();


    /*
     * Schütteln erkannt
     */

    if (
        change > 18
        &&
        now - lastShake > 350
    ) {

        const power =
            Math.min(
                change / 25,
                3
            );


        blowSnow(
            power
        );


        lastShake =
            now;
    }
}



/* ==================================================
   SENSOR UND MUSIK AKTIVIEREN
================================================== */

async function enableMotion() {


    /*
     * iPhone / iPad
     */

    if (
        typeof DeviceMotionEvent !==
        "undefined"
        &&
        typeof DeviceMotionEvent.requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceMotionEvent
                    .requestPermission();


            if (
                permission ===
                "granted"
            ) {

                window.addEventListener(
                    "devicemotion",
                    handleMotion
                );


                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );
            }

        }

        catch (error) {

            console.log(
                "Bewegungssensor nicht verfügbar:",
                error
            );
        }

    }


    /*
     * Android / andere Browser
     */

    else {

        window.addEventListener(
            "devicemotion",
            handleMotion
        );


        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );
    }


    /*
     * MUSIK STARTEN
     */

    try {

        music.volume =
            0.45;


        await music.play();

    }

    catch (error) {

        console.log(
            "Audio konnte nicht gestartet werden:",
            error
        );
    }


    /*
     * Button entfernen
     */

    startButton.style.display =
        "none";


    /*
     * Hinweis ausblenden
     */

    setTimeout(
        () => {

            hint.style.opacity =
                "0";

        },
        5000
    );
}



/* ==================================================
   BUTTON
================================================== */

startButton.addEventListener(
    "click",
    enableMotion
);



/* ==================================================
   HAUPT-ANIMATION
================================================== */

function animate(
    time
) {

    /*
     * Zeit zwischen den Frames
     */

    const delta =
        Math.min(
            (
                time -
                lastTime
            ) / 1000,
            0.05
        );


    lastTime =
        time;


    /*
     * Canvas löschen
     */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * Wind aktualisieren
     */

    updateWind();


    /*
     * -------------------------
     * HINTERGRUND
     * -------------------------
     */

    for (
        const snow
        of backSnow
    ) {

        snow.update(
            delta
        );

        snow.draw();
    }


    /*
     * -------------------------
     * MITTELGRUND
     * -------------------------
     */

    for (
        const snow
        of middleSnow
    ) {

        snow.update(
            delta
        );

        snow.draw();
    }


    /*
     * -------------------------
     * VORDERGRUND
     * -------------------------
     */

    for (
        const snow
        of frontSnow
    ) {

        snow.update(
            delta
        );

        snow.draw();
    }


    /*
     * -------------------------
     * AUFGEWIRBELTER SCHNEE
     * -------------------------
     */

    updateBlownSnow(
        delta
    );

    drawBlownSnow();


    /*
     * Nächsten Frame starten
     */

    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);


</script>

</body>
</html>
